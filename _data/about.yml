research:
  - title_en: Agents
    title_zh: 智能体
    scope_en: Reasoning and planning, reinforcement learning, memory and tool use, data and training, inference systems, and evaluation. Toward self-improving agents.
    scope_zh: 推理与规划、强化学习、记忆与工具使用、数据与训练、推理系统和评估。面向持续自我改进的智能体。
  - title_en: Physical AI & World Models
    title_zh: 物理智能与世界模型
    scope_en: Multimodal representations, generative and action-conditioned world models, simulation, embodied learning, planning, and control. Toward general-purpose physical intelligence.
    scope_zh: 多模态表征、生成式与动作条件世界模型、模拟、具身学习、规划与控制。面向通用物理智能。

