research:
  - title_en: Agents
    title_zh: 智能体
    scope_en: Reasoning, planning, memory, and tool use, with an emphasis on reinforcement learning and learning from interaction and experience.
    scope_zh: 推理、规划、记忆与工具使用，重点关注强化学习，以及从交互与经验中学习。
  - title_en: Physical AI & World Models
    title_zh: 物理智能与世界模型
    scope_en: Learning representations of physical dynamics and action consequences, and using world models for simulation, planning, and embodied decision-making.
    scope_zh: 学习物理动态与动作后果的表示，利用世界模型进行模拟、规划与具身决策。

