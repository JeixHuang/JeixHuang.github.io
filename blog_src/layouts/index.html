{{ define "main" }}
  <header class="blog-index-head">
    <h1 class="page-title">Blog</h1>
  </header>
  <ul class="post-list">
    {{ $pages := partial "blog-index-posts.html" . }}
    {{ range sort $pages "Date" "desc" }}
      {{ partial "post-card.html" . }}
    {{ else }}
      <li class="blog-empty-state"><p><span data-lang="en">No public posts here yet.</span><span data-lang="zh">这里暂时还没有公开文章。</span></p></li>
    {{ end }}
  </ul>
{{ end }}
