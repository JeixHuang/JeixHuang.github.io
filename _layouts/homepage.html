<!doctype html>
<html lang="en-US" data-locale="en" data-theme="dark" data-theme-choice="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="keywords" content="{{ site.keywords | escape }}">
    <meta name="color-scheme" content="light dark">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url | escape }}">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:description" content="{{ site.description | escape }}">
    <meta property="og:image" content="{{ site.avatar | escape }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ site.title | escape }}">
    <meta name="twitter:description" content="{{ site.description | escape }}">
    <meta name="twitter:image" content="{{ site.avatar | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url | escape }}">
    <link rel="icon" media="(prefers-color-scheme: dark)" href="{{ site.favicon_dark | escape }}" type="image/png">
    <link rel="icon" media="(prefers-color-scheme: light)" href="{{ site.favicon | escape }}" type="image/png">
    <script>
      (function () {
        var root = document.documentElement;
        var themeKey = "jeix-theme-choice";
        var localeKey = "jeix-locale";
        var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
        var themeChoice = "dark";
        var locale = "en";
        var motionChoice = "active";

        try {
          themeChoice = localStorage.getItem(themeKey) || "dark";
          locale = localStorage.getItem(localeKey) || "en";
          motionChoice = localStorage.getItem("jeix-motion-choice") || "active";
        } catch (error) {}

        if (themeChoice !== "light" && themeChoice !== "dark" && themeChoice !== "system") themeChoice = "dark";
        if (locale !== "en" && locale !== "zh") locale = "en";

        var theme = themeChoice === "system" ? (media && media.matches ? "dark" : "light") : themeChoice;
        root.dataset.theme = theme;
        root.dataset.themeChoice = themeChoice;
        root.dataset.locale = locale;
        root.dataset.userMotion = motionChoice === "paused" ? "paused" : "active";
        root.lang = locale === "zh" ? "zh-CN" : "en-US";
        root.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css" integrity="sha256-uFVgMKfistnJAfoCUQigIl+JfUaP47GrRKjf6CTPVmw=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="{{ "/assets/css/homepage-v6.css" | relative_url }}?v=ee1b90fa">
    <link rel="stylesheet" href="/assets/css/site-shell.css?v=20261026">
    <script src="{{ "/assets/js/ambient-field-v1.js" | relative_url }}?v=20261016d" defer></script>
    <script src="/assets/js/site-shell.js?v=20261016" defer></script>
    <script src="{{ "/assets/js/homepage-v6.js" | relative_url }}?v=20261016" defer></script>
    <script src="{{ "/assets/js/favicon-switcher.js" | relative_url }}" defer></script>
  </head>
  <body>
    <canvas class="flow-field" id="flow-field" aria-hidden="true"></canvas>
    <a class="skip-link" href="#content"><span data-lang="en">Skip to content</span><span data-lang="zh">跳到正文</span></a>

    <nav class="site-nav" aria-label="Primary navigation">
      <div class="nav-inner">
        <a class="brand" href="{{ "/" | relative_url }}" aria-label="{{ site.title }} home">
          <span class="brand-mark" aria-hidden="true">VH</span>
        </a>

        <div class="nav-right">
          <div class="nav-links">
            <a href="/#about-me" {% if page.section == 'about' %}aria-current="page"{% endif %}>About</a>
            <a href="/publications/" {% if page.section == 'publications' %}aria-current="page"{% endif %}>Publications</a>
            <a href="/projects/" {% if page.section == 'projects' %}aria-current="page"{% endif %}>Projects</a>
            <a href="/blog/" data-blog-link>Blog</a>
          </div>

          <div class="nav-controls" aria-label="Display controls">
            <div class="segmented-control" aria-label="Language">
              <button type="button" data-locale-option="en">EN</button>
              <button type="button" data-locale-option="zh">中</button>
            </div>
            <div class="segmented-control theme-control" aria-label="Theme">
              <button type="button" data-theme-option="light" aria-label="Light theme"><i class="fa-regular fa-sun" aria-hidden="true"></i></button>
              <button type="button" data-theme-option="dark" aria-label="Dark theme"><i class="fa-regular fa-moon" aria-hidden="true"></i></button>
              <button type="button" data-theme-option="system" aria-label="System theme"><i class="fa-solid fa-display" aria-hidden="true"></i></button>
            </div>
            <div class="segmented-control motion-control" aria-label="Ambient motion">
              <button type="button" data-motion-toggle aria-label="Pause ambient motion" aria-pressed="false"><span data-motion-icon aria-hidden="true">Ⅱ</span></button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <main class="site-shell" id="content">
      {% include identity.html %}

      <div class="content-column">
        {{ content }}

        <footer class="site-footer">
          <p>© 2026 {{ site.title }}</p>
        </footer>
      </div>
    </main>
  </body>
</html>
